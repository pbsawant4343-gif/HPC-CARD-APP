<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विद्यार्थी सराव ॲप</title>
    <!-- रिपोर्ट कार्ड फोटो स्वरूपात डाउनलोड करण्यासाठी html2canvas लायब्ररी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #4b0082;
            font-size: 1.2rem;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-top: 10px;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        .btn-report {
            background-color: #17a2b8;
        }
        .btn-report:hover {
            background-color: #138496;
        }
        #quiz-section, #report-card {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #28a745;
            border-radius: 10px;
            background-color: #e9f7ef;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #fff;
            color: #333;
            border: 2px solid #007bff;
        }
        /* फुले उडण्याचा ॲनिमेशन इफेक्ट */
        .flower {
            position: fixed;
            bottom: -20px;
            font-size: 2rem;
            animation: floatUp linear forwards;
            z-index: 9999;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 इयत्ता व घटक निवडा</h2>
    
    <label for="studentName">विद्यार्थ्याचे नाव:</label>
    <input type="text" id="studentName" placeholder="नाव प्रविष्ट करा">

    <label for="subject">विषय निवडा:</label>
    <select id="subject">
        <option value="math">गणित (Mathematics)</option>
        <option value="english">इंग्रजी (English)</option>
    </select>

    <label for="std">इयत्ता निवडा:</label>
    <select id="std">
        <option value="1">इयत्ता १ ली</option>
        <option value="2">इयत्ता २ री</option>
        <option value="3">इयत्ता ३ री</option>
        <option value="4">इयत्ता ४ थी</option>
    </select>

    <button onclick="startGame()">🎮 खेळ सुरू करा</button>

    <!-- प्रश्नांचा विभाग -->
    <div id="quiz-section">
        <h3 id="question-text">प्रश्न येथे दिसेल</h3>
        <div class="options-container" id="options">
            <!-- पर्याय येथे येतील -->
        </div>
        <p id="feedback" style="font-weight:bold; text-align:center; margin-top:10px;"></p>
    </div>

    <button class="btn-report" onclick="showReport()">📋 विद्यार्थी अभ्यास रिपोर्ट कार्ड</button>

    <!-- रिपोर्ट कार्ड विभाग (डाउनलोड करण्यासाठी) -->
    <div id="report-card">
        <h3 style="text-align:center; color:#d35400;">🏆 विद्यार्थी प्रगती रिपोर्ट</h3>
        <p><b>नाव:</b> <span id="r-name">-</span></p>
        <p><b>इयत्ता:</b> <span id="r-std">-</span> | <b>विषय:</b> <span id="r-sub">-</span></p>
        <p><b>एकूण गुण:</b> <span id="r-score">0</span></p>
        <p style="font-size: 0.8rem; text-align: center; color: #555;">जि. प. प्राथमिक शाळा वांझोळे</p>
    </div>
    
    <button id="downloadBtn" style="display:none;" onclick="downloadReport()">📸 रिपोर्ट कार्ड फोटो डाउनलोड करा</button>

</div>

<!-- शाबासकीचा आवाज (ऑडिओ फाईलची लिंक तुम्ही बदलू शकता) -->
<audio id="praiseAudio" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
    let score = 0;
    
    // नमुना प्रश्न (तुम्ही यात तुमचे प्रश्न वाढवू शकता)
    const questions = {
        "math": {
            "1": { q: "२ + ३ = किती?", options: ["४", "५", "६", "७"], ans: "५" },
            "2": { q: "१० - ४ = किती?", options: ["५", "६", "७", "८"], ans: "६" },
            "3": { q: "५ × ३ = किती?", options: ["१५", "१२", "१०", "२०"], ans: "१५" },
            "4": { q: "२० ÷ ४ = किती?", options: ["४", "५", "६", "७"], ans: "५" }
        },
        "english": {
            "1": { q: "A for...?", options: ["Apple", "Bat", "Cat", "Dog"], ans: "Apple" },
            "2": { q: "What is the color of sky?", options: ["Red", "Blue", "Green", "Yellow"], ans: "Blue" },
            "3": { q: "Opposite of Good?", options: ["Bad", "Happy", "Sad", "Nice"], ans: "Bad" },
            "4": { q: "Plural of Boy?", options: ["Boyes", "Boys", "Boies", "Boy"], ans: "Boys" }
        }
    };

    function startGame() {
        const name = document.getElementById("studentName").value;
        if(name.trim() === "") {
            alert("कृपया विद्यार्थ्याचे नाव लिहा!");
            return;
        }
        const sub = document.getElementById("subject").value;
        const std = document.getElementById("std").value;
        
        const qData = questions[sub][std];
        
        document.getElementById("quiz-section").style.display = "block";
        document.getElementById("question-text").innerText = qData.q;
        document.getElementById("feedback").innerText = "";
        
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";
        
        qData.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, qData.ans);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct) {
        const feedback = document.getElementById("feedback");
        if (selected === correct) {
            score += 10; // अचूक उत्तराला १० गुण
            feedback.innerText = "⭐ शाब्बास! अचूक उत्तर!";
            feedback.style.color = "green";
            playAudio();
            showFlowers();
        } else {
            feedback.innerText = "❌ चुकले, पुन्हा प्रयत्न कर!";
            feedback.style.color = "red";
        }
    }

    function playAudio() {
        const audio = document.getElementById("praiseAudio");
        audio.play(); // ऑडिओ प्ले होईल
    }

    function showFlowers() {
        const flowers = ['🌸', '🌼', '🌺', '🌻', '🎉'];
        for (let i = 0; i < 30; i++) {
            let flower = document.createElement('div');
            flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            flower.classList.add('flower');
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(flower);
            
            // ॲनिमेशन संपल्यावर फुले काढून टाकणे
            setTimeout(() => { flower.remove(); }, 5000);
        }
    }

    function showReport() {
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("report-card").style.display = "block";
        document.getElementById("downloadBtn").style.display = "block";

        document.getElementById("r-name").innerText = document.getElementById("studentName").value;
        document.getElementById("r-std").innerText = document.getElementById("std").options[document.getElementById("std").selectedIndex].text;
        document.getElementById("r-sub").innerText = document.getElementById("subject").options[document.getElementById("subject").selectedIndex].text;
        document.getElementById("r-score").innerText = score;
    }

    // रिपोर्ट कार्ड फोटो (Image) स्वरूपात डाउनलोड करण्यासाठी फंक्शन
    function downloadReport() {
        const reportElement = document.getElementById("report-card");
        html2canvas(reportElement).then(canvas => {
            const link = document.createElement('a');
            link.download = 'विद्यार्थी_रिपोर्ट_कार्ड.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>

</body>
</html>
